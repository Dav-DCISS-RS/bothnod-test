<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<style>html,body{margin:0;padding:0;background:#141017}</style>
</head>
<body>
<title>Bothnod</title>
<meta name="theme-color" content="#141017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bothnod">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400;1,6..96,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : une colonne façon appli mobile (440px max), écrans successifs, barre d'actions basse. Univers « nuit » assumé, thème unique sombre. */
:root{
  --bg:#141017;
  --surface:#1f1923;
  --surface-2:#2a222f;
  --line:#3b3041;
  --fg:#f3eaef;
  --muted:#a5939f;
  --rose:#e8698a;      /* J'aime + accent */
  --rose-ink:#2a0f18;
  --gold:#d8b26a;      /* Pourquoi pas / accords */
  --gold-ink:#2a1f08;
  --no:#6d6070;        /* Je n'aime pas */
  --danger:#ff8a7a;
  --font-display:"Bodoni Moda", "Didot", "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;min-height:100%;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.6rem;line-height:1.05;font-style:italic}
h2{font-size:1.75rem;line-height:1.15}
h3{font-size:1.2rem;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:600 .95rem/1 var(--font-body);padding:14px 18px;border-radius:999px;cursor:pointer;text-align:center;transition:transform .12s ease, background .15s ease}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.ans:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);font:500 .9rem var(--font-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.link:hover{color:var(--fg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.back{background:none;border:0;color:var(--fg);font:500 .95rem var(--font-body);cursor:pointer;padding:8px 0;display:inline-flex;gap:6px;align-items:center}
.brand{font-family:var(--font-display);font-style:italic;font-size:1.4rem}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=password],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:400 1rem var(--font-body);padding:12px 14px;width:100%;box-sizing:border-box}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--rose);width:18px;height:18px;flex:none}
.banner{background:var(--surface-2);border:1px dashed var(--gold);color:var(--gold);border-radius:10px;padding:8px 12px;font-size:.82rem}
.err{color:var(--danger);font-size:.85rem}

/* Accueil */
.hero{padding-block:28px 6px;display:flex;flex-direction:column;gap:14px}
.hero .mark{display:flex;gap:6px;align-items:center}
.hero .mark i{width:22px;height:22px;border-radius:50%;display:block}
.hero .mark i:first-child{background:var(--rose)}
.hero .mark i:last-child{background:var(--gold);margin-left:-12px;mix-blend-mode:screen}
.principles{display:grid;gap:10px}
.principle{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.principle b{font-family:var(--font-display);font-style:italic;color:var(--gold);font-size:1.3rem;line-height:1.1}

/* Partenaires */
.partners{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.partner{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.partner .name{font-family:var(--font-display);font-size:1.35rem;overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:99px}
.partner .btn{padding:11px 12px;font-size:.85rem}

/* Questionnaire */
.qhead{display:flex;flex-direction:column;gap:8px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;gap:18px}
.qcard .label{font-family:var(--font-display);font-size:1.9rem;line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.qcard .desc{color:var(--muted);font-size:.92rem}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.lvl i.on{background:var(--rose)}
.roles{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{background:none;border:0;color:var(--muted);font:600 .82rem var(--font-body);padding:9px 4px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.answers{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:12px;width:100%;border-radius:16px;padding:16px 18px;font:600 1.02rem var(--font-body);cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:left}
.ans .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid currentColor}
.ans.love{color:var(--rose)} .ans.maybe{color:var(--gold)} .ans.no{color:var(--muted)}
.ans span.t{color:var(--fg)}
.ans.sel.love{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.ans.sel.maybe{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.ans.sel.no{background:var(--no);color:var(--fg);border-color:var(--no)}
.ans.sel span.t{color:inherit}
.ans.sel .dot{background:currentColor;position:relative}
.ans.sel .dot::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:900;color:var(--fg)}
.ans.sel.no .dot::after{color:var(--no)}
.ans{transition:transform .09s ease, background .15s ease, opacity .2s ease}
.ans:active{transform:scale(.97)}
.answers.picked .ans:not(.sel){opacity:.45}
.ans.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ans.pop{animation:none}.ans:active{transform:none}}
.risk{border:1px solid color-mix(in srgb,var(--danger) 55%,transparent);background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:.85rem}
.risk b{color:var(--danger)}
.tip{border-left:2px solid var(--gold);padding-left:10px;font-size:.85rem;color:var(--muted)}
.qnav{display:flex;justify-content:space-between;align-items:center}

/* Catégories */
.cats{display:grid;gap:8px}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--fg);text-align:left;font:inherit}
.cat:hover{background:var(--surface-2)}
.cat .n{font-weight:600}
.cat .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.cat .bar{grid-column:1/-1}

/* Profil */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;font:600 .85rem var(--font-body);cursor:pointer}
.tab.on{color:var(--fg);border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 12px;font:500 .85rem var(--font-body);cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
.chip em{font-style:normal;color:var(--muted);font-size:.78rem;margin-left:4px}
.chip.love{border-color:color-mix(in srgb,var(--rose) 60%,var(--line))}
.chip.maybe{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.chip.no{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.stat.love b{color:var(--rose)} .stat.maybe b{color:var(--gold)} .stat.no b{color:var(--muted)}

/* Bothnod */
.deck{position:relative;height:300px;display:grid;place-items:center}
.deck .back-card{position:absolute;width:72%;height:260px;border-radius:22px;background:
  radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--rose) 35%,transparent),transparent 55%),
  radial-gradient(circle at 70% 70%,color-mix(in srgb,var(--gold) 30%,transparent),transparent 55%),
  var(--surface-2);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.deck .back-card:nth-child(1){transform:rotate(-7deg) translateX(-14px)}
.deck .back-card:nth-child(2){transform:rotate(5deg) translateX(12px)}
.deck .back-card:nth-child(3){display:grid;place-items:center;cursor:pointer}
.deck .back-card:nth-child(3) span{font-family:var(--font-display);font-style:italic;font-size:1.5rem;color:var(--fg)}
.reveal{background:var(--surface);border:1px solid var(--gold);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;animation:flip .5s ease both}
@keyframes flip{from{transform:rotateY(80deg) scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.btn{transition:none}}
.reveal .label{font-family:var(--font-display);font-size:2rem;line-height:1.1;overflow-wrap:anywhere}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface-2)}
.pill.s4{color:var(--rose);border-color:var(--rose)}
.pill.s3{color:var(--gold);border-color:var(--gold)}
.pill.s2{color:var(--fg)}
.whois{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.whois dt{color:var(--muted)} .whois dd{margin:0;font-weight:600}
.list{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;align-items:center}
.mrow .t{font-weight:600;overflow-wrap:anywhere;min-width:0}
.mrow .s{grid-column:1/-1;font-size:.82rem;color:var(--muted)}

/* Moment */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.level{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;color:var(--fg);text-align:left;font:inherit;display:flex;flex-direction:column;gap:4px}
.level.on{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 10%,var(--surface))}
.level b{font-family:var(--font-display);font-size:1.15rem;font-weight:500}
.level[disabled]{opacity:.4;cursor:not-allowed}
.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step::before{counter-increment:s;content:counter(s);font-family:var(--font-display);font-style:italic;font-size:1.5rem;color:var(--gold);line-height:1}
.step h4{margin:0 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.step p{overflow-wrap:anywhere}
.safe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.safe div{border-radius:10px;padding:8px;font-size:.8rem;text-align:center;font-weight:600}
.safe .g{background:color-mix(in srgb,#5fbf8a 22%,transparent);color:#9fe0bb}
.safe .o{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.safe .r{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger)}

/* PIN */
.pin{display:flex;flex-direction:column;gap:16px;align-items:stretch;padding-top:30px}
.pin input{font-size:1.8rem;letter-spacing:.6em;text-align:center;font-variant-numeric:tabular-nums}

.footer-actions{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.footer-actions > div{width:100%;max-width:408px;display:flex;gap:10px}
.footer-actions .btn{flex:1}
.row.center{justify-content:center}
.row.center > .btn{flex:1;min-width:130px}
/* Album */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2);border:0;padding:0;cursor:pointer}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s ease}
.blur .thumb img,.blur .thumb video{filter:blur(16px) saturate(.5)}
.thumb .meta{position:absolute;right:6px;bottom:6px;display:flex;gap:6px;font-size:.7rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.likebar{display:flex;align-items:center;gap:10px}
.likebar .heart{background:none;border:0;font-size:1.7rem;line-height:1;cursor:pointer;color:var(--fg);padding:4px}
.likebar .heart.on{color:var(--rose)}
.likebar .heart.pop{animation:pop .3s ease}
.com{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.com:first-child{border-top:0;padding-top:0}
.com p{overflow-wrap:anywhere}
.thumb .tag{position:absolute;left:6px;bottom:6px;font-size:.68rem;font-weight:600;background:rgba(20,16,23,.75);color:var(--fg);padding:2px 7px;border-radius:6px}
.viewer img,.viewer video{width:100%;max-width:100%;border-radius:14px;max-height:68vh;object-fit:contain;background:#000;display:block}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--fg);font:inherit;width:100%;text-align:left}
.toggle .sw{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .15s}
.toggle[aria-checked="true"] .sw{background:var(--rose)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(16px)}
.chal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.chal:first-of-type{border-top:0;padding-top:0}
.chal p{min-width:0;overflow-wrap:anywhere}
.chal .btn{padding:10px 14px;font-size:.82rem}
.previews{display:flex;gap:6px;overflow-x:auto}
.previews img,.previews video{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
/* Onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar > div{width:100%;max-width:408px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tabbar button{background:none;border:0;color:var(--muted);font:600 .78rem var(--font-body);padding:8px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--fg)}
.tabbar button i{width:6px;height:6px;border-radius:50%;background:transparent}
.tabbar button.on i{background:var(--rose)}
.tabbar .badge{background:var(--rose);color:var(--rose-ink);border-radius:99px;padding:0 6px;font-size:.68rem;margin-left:4px}
.tabbar button{min-width:0;position:relative}
.tabbar button > .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0}
.tabbar button > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar.many > div{gap:2px}
.tabbar.many button{font-size:.68rem;padding-inline:2px}
.tabbar.many .badge{margin-left:2px;padding:0 4px}
/* Fil */
.feed{display:flex;flex-direction:column;gap:22px}
.post{display:flex;flex-direction:column;gap:10px}
.post .who{display:flex;align-items:center;gap:10px;min-width:0}
.post .av{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(from 90deg,var(--rose),var(--gold),var(--rose))}
.post .who b{font-weight:600;overflow-wrap:anywhere}
.post .media{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.post .media img,.post .media video{width:100%;height:100%;object-fit:cover;display:block}
.post .art{position:absolute;inset:0}
.post .ex{position:absolute;top:10px;left:10px;font-size:.68rem;font-weight:600;background:rgba(20,16,23,.7);color:var(--fg);padding:3px 8px;border-radius:6px}
.post .acts{display:flex;align-items:center;gap:4px}
.post .acts button{background:none;border:0;color:var(--fg);font:600 .88rem var(--font-body);padding:6px 8px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.post .acts button:hover{background:var(--surface)}
.post .acts .liked{color:var(--rose)}
.post .acts .rep{margin-left:auto;color:var(--muted);font-weight:500;font-size:.8rem}
.post .cap{overflow-wrap:anywhere}
.post .tags{display:flex;gap:6px;flex-wrap:wrap}
.post .tags span{font-size:.75rem;color:var(--gold)}
.sentinel{height:40px;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
.status{font-size:.72rem;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid var(--line);white-space:nowrap}
.status.pending{color:var(--gold);border-color:var(--gold)}
.status.review{color:var(--fg)}
.status.live{color:#9fe0bb;border-color:#5fbf8a}
.status.refused,.status.withdrawn{color:var(--muted)}
.pubrow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.pubrow:first-of-type{border-top:0;padding-top:0}
.pubrow .mini{width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.pubrow .mini img,.pubrow .mini video{width:100%;height:100%;object-fit:cover}
.pubrow > div{min-width:0;display:flex;flex-direction:column;gap:6px}
/* Messagerie */
.msgs{display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;min-width:0;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--rose) 16%,var(--surface));border-color:color-mix(in srgb,var(--rose) 40%,var(--line));border-radius:16px 16px 4px 16px}
.bub.invite{border-color:var(--gold)}

  db:null, mem:[], ok:true,
  open(){ if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej) => { const r = indexedDB.open("accords-media",1);
      r.onupgradeneeded = () => r.result.createObjectStore("media",{keyPath:"id"});
      r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async run(mode, fn){ const db = await this.open();
    return new Promise((res,rej) => { const t = db.transaction("media",mode), q = fn(t.objectStore("media"));
      t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  async all(){ try{ return await this.run("readonly", s => s.getAll()); }catch(e){ this.ok = false; return this.mem.slice(); } },
  async put(m){ try{ await this.run("readwrite", s => s.put(m)); }catch(e){ this.ok = false; this.mem.push(m); } },
  async del(id){ this.mem = this.mem.filter(m => m.id !== id); try{ await this.run("readwrite", s => s.delete(id)); }catch(e){} },
  async clear(){ this.mem = []; try{ await this.run("readwrite", s => s.clear()); }catch(e){} },
};

/* Connexion : clé d'accès (passkey) = empreinte ou Face ID du téléphone.
   Prototype : essaie le vrai capteur (WebAuthn) et bascule sur une simulation si l'aperçu le bloque.
   Session : ouverte une fois au lancement ; la vérification d'âge du fil expire en quittant l'appli ou après 1 h d'inactivité (Arcom). */
const SESSION = {unlocked:false, ageAt:0, last:Date.now()};
const AGE_TTL = 36e5;
const OWN = () => S.auth.mode === "own";
const isMe = p => OWN() && S.auth.me === p;
const hasKey = p => !!(S.auth.passkey && S.auth.passkey[p]);
const sessionOpen = p => isMe(p) && SESSION.unlocked;
const ageValid = () => SESSION.ageAt && Date.now() - SESSION.ageAt < AGE_TTL && Date.now() - SESSION.last < AGE_TTL;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
function simBio(label){ return new Promise(res => {
  const d = document.createElement("div"); d.className = "bio-ov"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.innerHTML = `<div class="bio-box"><div class="bio-fp" aria-hidden="true"></div><h3>${esc(label)}</h3>
    <p class="small muted">Simulation : sur votre téléphone, c'est le capteur d'empreinte ou Face ID qui s'affiche ici.</p>
    <button class="btn gold block" data-bio="1">Poser le doigt (simulation)</button><button class="link" data-bio="0">Annuler</button></div>`;
  document.body.appendChild(d); if(S.lang === "en") translateDom(d);
  d.querySelector("[data-bio='1']").focus();
  d.querySelectorAll("[data-bio]").forEach(b => b.onclick = () => { d.remove(); res(b.dataset.bio === "1"); }); }); }
async function registerPasskey(p){
  const name = S.couple.names[p];
  try{
    if(!window.PublicKeyCredential || !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) throw new Error("none");
    const cred = await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), rp:{name:"Bothnod"},
      user:{id:crypto.getRandomValues(new Uint8Array(16)), name, displayName:name},
      pubKeyCredParams:[{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred"}, timeout:60000}});
    return {kind:"real", id:b64(cred.rawId), at:Date.now()};
  }catch(e){ return (await simBio(`Enregistrer l'empreinte de ${name}`)) ? {kind:"sim", at:Date.now()} : null; }
}
async function bioCheck(p, label){
  const k = S.auth.passkey[p]; if(!k) return false;
  if(k.kind === "real"){ try{ await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:"public-key", id:unb64(k.id)}], userVerification:"required", timeout:60000}}); return true; }catch(e){} }
  return simBio(label || `Empreinte de ${S.couple.names[p]}`);
}
function bioBtn(p, next, extra=""){ return hasKey(p) && isMe(p) ? `<button type="button" class="btn gold block" data-bio-go="${p}" data-next="${next}" ${extra}>Déverrouiller avec l'empreinte</button>` : ""; }

["click","keydown","touchstart"].forEach(t => document.addEventListener(t, () => {
  const n = Date.now(); if(n - SESSION.last > AGE_TTL){ SESSION.ageAt = 0; if(V && V.view === "feed"){ SESSION.last = n; render(); return; } } SESSION.last = n; }, {capture:true, passive:true}));

const ICON = "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#141017"/><circle cx="210" cy="256" r="104" fill="#e8698a"/><circle cx="302" cy="256" r="104" fill="#d8b26a" fill-opacity=".85"/></svg>`);
let DEFER = null;

/* Synchronisation mobile → web (prototype : code à copier ; appli finale : compte) */
function exportCode(p){
  const data = {v:1, name:S.couple.names[p], a:S.answers[p], b:S.bonus[p], r:S.revealed};
  return "ACC1-" + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function importCode(p, code){
  const raw = code.trim().replace(/^ACC1-/, "");
  const d = JSON.parse(decodeURIComponent(escape(atob(raw))));
  if(d.v !== 1 || typeof d.a !== "object") throw new Error("format");
  let added = 0, kept = 0;
  Object.entries(d.a).forEach(([id,a]) => { if(!ITEMS[id]) return; if(S.answers[p][id]) kept++; else { S.answers[p][id] = a; added++; } });
  Object.entries(d.b || {}).forEach(([k,v]) => { if(!S.bonus[p][k]) S.bonus[p][k] = v; });
  (d.r || []).forEach(id => { if(ITEMS[id] && !S.revealed.includes(id)) S.revealed.push(id); });
  save();
  return `${added} réponse${added>1?"s":""} importée${added>1?"s":""}${kept ? `, ${kept} déjà présente${kept>1?"s":""} conservée${kept>1?"s":""}` : ""}.`;
}

    <div class="mark"><i></i><i></i></div>
    <h1>Bothnod</h1>
    <p class="muted">Chacun répond seul, en privé. L'application ne vous propose que ce que vous avez <em>tous les deux</em> envie de vivre.</p>
    ${MOBILE || !MOBILE_APP ? "" : `<p class="small muted">Déjà répondu sur l'appli mobile ? Créez votre espace, puis importez vos réponses depuis les Réglages.</p>`}
  </section>
  ${MOBILE ? "" : installCard(false)}
  <div class="card principles">
    <div class="principle"><b>1</b><p><strong>Vos réponses restent secrètes.</strong> Votre partenaire ne voit jamais vos « oui » s'il ou elle a dit non.</p></div>
    <div class="principle"><b>2</b><p><strong>Une proposition = un double oui.</strong> Si Bothnod suggère quelque chose, c'est que vous l'avez choisi tous les deux. C'est le jeu.</p></div>
    <div class="principle"><b>3</b><p><strong>Rien n'est figé.</strong> Vous pouvez changer d'avis à tout moment, et un oui dans l'appli ne remplace jamais le consentement du moment.</p></div>
  </div>
  <div class="stack">
    <button class="btn primary block" data-go="setup">Créer notre espace</button>
    <button class="btn ghost block" data-act="demo">Essayer avec un couple d'exemple</button>
  </div>
  <p class="small muted">Prototype : les réponses sont enregistrées uniquement dans ce navigateur, sur cet appareil.</p>`; },

/* ---------- Création du couple ---------- */
setup(){ return `
  <div class="topbar"><button class="back" data-go="welcome">← Retour</button><span class="brand">Bothnod</span></div>
  <h2>Votre espace à deux</h2>
  <p class="muted">Chacun choisit un code à 4 chiffres pour protéger ses réponses. Tapez-le sans que l'autre regarde.</p>
  <form id="setupForm" class="stack" novalidate>
    ${[0,1].map(p => `<div class="card">
      <span class="eyebrow">Partenaire ${p+1}</span>
      <label class="f">Prénom<input type="text" id="n${p}" maxlength="24" autocomplete="off" required></label>
      ${OPEN() ? "" : `<label class="f">Code secret (4 chiffres)<input type="password" id="p${p}" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off" required></label>`}
    </div>`).join("")}
    <label class="check"><input type="checkbox" id="adult"> Nous sommes deux adultes (18 ans et plus) et nous utilisons Bothnod d'un commun accord.</label>
    <label class="check"><input type="checkbox" id="alone"> Chacun répondra seul, sans regarder les réponses de l'autre.</label>
    <p class="err" id="setupErr" hidden></p>
    <button class="btn primary block" type="submit">Commencer</button>
  </form>`; },

/* ---------- Accueil du couple ---------- */
home(){
  const all = allMatches(), m = all.filter(x => openLv(x.item.l)), unrevealed = m.filter(x => !S.revealed.includes(x.item.id));
  const locked = all.filter(x => !openLv(x.item.l) && !S.revealed.includes(x.item.id)).length;
  const pendingDeb = [0,1].filter(p => S.lived.some(l => !l.deb[p]));
  const monthLived = S.lived.filter(l => Date.now() - l.date < 30*864e5).length;
  const today = new Date().toISOString().slice(0,10), card = dailyCard();
  const ready = done(0) > 0 && done(1) > 0;
  return `
  <div class="topbar"><span class="brand">Bothnod</span><div class="row">${PLUS() ? `<span class="lockpill">Bothnod+</span>` : `<button class="link" data-go="plus">Bothnod+</button>`}<button class="link" data-go="settings">Réglages</button></div></div>
  <h2>${nm(0)} <span class="muted" style="font-style:italic">&amp;</span> ${nm(1)}</h2>
  <div class="partners">
    ${[0,1].map(p => { const d = done(p), pct = Math.round(d/TOTAL*100); return `
    <div class="partner">
      <div class="name">${nm(p)}</div>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <span class="small muted">${d} / ${TOTAL} réponses</span>
      <button class="btn ${d<TOTAL?"primary":""}" data-pin="${p}" data-next="cats">${d===0?"Répondre":d<TOTAL?"Continuer":"Modifier"}</button>
      <button class="btn ghost" data-pin="${p}" data-next="profile">Mon profil</button>
    </div>`;}).join("")}
  </div>
  <section class="card">
    <span class="eyebrow">Vos accords</span>
    ${ready ? `
      <h3>${unrevealed.length ? `${unrevealed.length} accord${unrevealed.length>1?"s":""} à découvrir` : m.length ? "Tous vos accords sont découverts" : "Pas encore d'accord"}</h3>
      <p class="muted small">${m.length ? "Chaque carte est une envie que vous partagez. Retournez-les ensemble, une à une." : "Continuez le questionnaire : les accords apparaissent dès que vos réponses se croisent."}</p>
      <div class="row">
        <button class="btn gold" data-go="deck" ${unrevealed.length?"":"disabled"}>Retourner une carte</button>
        <button class="btn" data-act="composeFree" ${m.some(x=>!x.item.risk && x.item.cat!=="ouverture")?"":"disabled"}>Composer un moment</button>
      </div>
      ${locked ? `<p class="small"><span class="lockpill">Bothnod+</span> ${locked} accord${locked>1?"s":""} plus intense${locked>1?"s":""} vous attend${locked>1?"ent":""}. <button class="link" data-go="plus">Découvrir</button></p>` : ""}
      ${S.revealed.length ? `<button class="link" data-go="revealed">${S.revealed.length>1 ? `Voir les ${S.revealed.length} accords déjà découverts` : "Voir l'accord déjà découvert"}</button>` : ""}
      ${done(0)<TOTAL || done(1)<TOTAL ? `<p class="small muted">Plus vous répondez, plus les propositions sont riches.</p>` : ""}
    ` : `<h3>En attente de vos réponses</h3><p class="muted small">Les accords s'affichent quand vous avez commencé le questionnaire tous les deux.</p>`}
  </section>
  ${plannedCard()}
  ${homeExtras()}
  ${MOBILE || Date.now() - (S.installHide || 0) < 30*DAY ? "" : installCard(true)}
  ${pendingDeb.length ? `<section class="card" style="border-color:var(--gold)">
    <span class="eyebrow">Bilan de votre dernier moment</span>
    <p class="muted small">Chacun dit en privé ce qu'il en a pensé. Vos propositions s'ajustent, sans que l'autre voie votre bilan.</p>
    <div class="row">${pendingDeb.map(p => `<button class="btn gold" data-pin="${p}" data-next="debrief">Bilan de ${nm(p)}</button>`).join("")}</div>
  </section>` : ""}
  <section class="conn">
    <div class="spread"><span class="eyebrow">Carte du jour · ${esc(card.k)}</span>${S.daily[today] ? `<span class="status live">Fait</span>` : ""}</div>
    <p class="t">${esc(card.t)}</p>
    <div class="row">${S.daily[today] ? "" : `<button class="btn gold" data-act="dailyDone">C'est fait</button>`}${S.distance.on ? `<button class="btn ghost" data-go="distance">Rituels à distance</button>` : `<button class="btn ghost" data-go="${PLUS() ? "connect" : "plus"}">${PLUS() ? "Toutes les cartes" : "Plus de cartes avec Bothnod+"}</button>`}</div>
  </section>
  <section class="card">
    <span class="eyebrow">Programmes guidés</span>
    <h3>${PROGRAMS.length} parcours pour avancer à deux</h3>
    <p class="muted small">Quelques étapes par semaine : rituels, toucher sans objectif, conversations. ${monthLived ? `${monthLived} moment${monthLived>1?"s":""} vécu${monthLived>1?"s":""} ce mois-ci.` : ""}</p>
    <div class="row"><button class="btn" data-go="programs">Voir les programmes</button></div>
  </section>
  ${MOBILE ? `<section class="card">
    <span class="eyebrow">Bothnod sur le web</span>
    <h3>Le questionnaire complet et votre espace à deux</h3>
    <p class="muted small">Sur le web : toutes les intensités, une messagerie rien qu'à vous et un album privé. Vos réponses vous suivent grâce à votre code de synchronisation.</p>
    <div class="row"><button class="btn" data-go="settings">Mon code de synchronisation</button></div>
  </section>` : `<section class="card">
    <span class="eyebrow">Entre nous</span>
    <h3>${unread(0)+unread(1) ? `${unread(0)+unread(1)} message${unread(0)+unread(1)>1?"s":""} non lu${unread(0)+unread(1)>1?"s":""}` : "Messagerie et pense-bêtes"}</h3>
    <p class="muted small">Invitations par carte, check-in du jour et liste partagée. Chacun l'ouvre avec son code.</p>
    <div class="row"><button class="btn" data-go="msgPin">Ouvrir la messagerie</button><button class="btn ghost" data-go="albumPin">Notre album</button></div>
  </section>`}
  <section class="card">
    <span class="eyebrow">Votre signal de sécurité</span>
    <div class="safe"><div class="g">Vert<br>on continue</div><div class="o">Orange<br>on ralentit</div><div class="r">Rouge<br>on arrête</div></div>
    <p class="small muted">Valable pour tous vos moments. Bouche empêchée : trois tapes ou un objet que l'on lâche.</p>
  </section>
  ${tabbar("home")}`; },

/* ---------- Code secret ---------- */
pin(){ return `
  <div class="topbar"><button class="back" data-go="home">← Retour</button></div>
  <form class="pin" id="pinForm" novalidate>
    <span class="eyebrow">Espace privé</span>
    <h2>${nm(V.p)}, tapez votre code</h2>
    <p class="muted small">${nm(1-V.p)}, c'est le moment de détourner le regard.</p>
    <input type="password" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Code secret">
    <p class="err" id="pinErr" hidden>Code incorrect. Réessayez.</p>
    <button class="btn primary block" type="submit">Entrer</button>
    ${bioBtn(V.p, V.next)}
    ${pinNote(V.p)}
  </form>`; },

/* ---------- Choix privé de l'intensité ---------- */
lvPick(){ const p = V.p, v = S.lvVote || {}, it = v.key && v.key !== "free" ? ITEMS[v.key] : null, minL = it ? it.l : 1, cur = (v.v || [])[p];
  const prev = V.prev, pmo = V.pmo;
  return `
  <div class="topbar"><button class="back" data-act="lvBack">← Annuler</button><span class="small muted">Espace de ${nm(p)}</span></div>
  <span class="eyebrow">En privé</span>
  <h2>Jusqu'où as-tu envie d'aller ce soir ?</h2>
  ${it ? cardRecap(it) : ""}
  <p class="muted small">Touche une intensité pour voir le scénario. ${nm(1-p)} ne verra pas ta réponse : vous découvrirez seulement l'intensité qui vous convient à tous les deux.</p>
  <div class="levels">${LEVELS.map(L => L.n < minL
    ? `<button class="level" disabled><b>${L.name}</b><span class="small muted">Cette carte commence en ${LEVELS[minL-1].name}</span>${lvlDots(L.n)}</button>`
    : openLv(L.n)
    ? `<button class="level ${prev===L.n || (!prev && cur===L.n)?"on":""}" data-prev="${L.n}"><b>${L.name}</b><span class="small muted">${L.d}</span>${lvlDots(L.n)}${cur===L.n ? `<span class="small" style="color:var(--gold)">Ton choix actuel</span>` : ""}</button>`
    : `<button class="level" data-go="plus"><b>${L.name}</b><span class="small muted">${L.d}</span><span><span class="lockpill">Bothnod+</span></span></button>`).join("")}</div>
  ${pmo ? `<section class="card">
      <span class="eyebrow">Aperçu · ${LEVELS[pmo.lv-1].name}</span>
      <h3>${esc(pmo.title)}</h3>
      ${stepsHtml(pmo)}
      <div class="row center"><button class="btn primary" data-vote="${pmo.lv}">Je choisis ${LEVELS[pmo.lv-1].name}</button><button class="btn ghost" data-prev="${pmo.lv}">Autre scénario</button></div>
      <p class="small muted" style="text-align:center">Si ${nm(1-p)} choisit plus doux, c'est son intensité qui sera retenue, sans que tu saches laquelle était la sienne.</p>
    </section>` : `<p class="small muted" style="text-align:center">Aucune intensité sélectionnée pour l'instant.</p>`}
  <button class="btn ghost block" data-vote="0">Pas ce soir</button>`; },

/* ---------- Verrouillage à l'ouverture ---------- */
locked(){ const p = S.auth.me; return `
  <section class="hero" style="align-items:center;text-align:center;padding-top:60px">
    <div class="mark"><i></i><i></i></div>
    <h1>Bothnod</h1>
    <p class="muted">Appli verrouillée. Seul·e ${nm(p)} peut l'ouvrir sur ce téléphone.</p>
  </section>
  <button class="btn gold block" data-bio-go="${p}" data-next="home">Déverrouiller avec l'empreinte</button>
  ${OPEN() ? "" : `<button class="link" data-pin="${p}" data-next="unlockHome" style="align-self:center">Utiliser mon code</button>`}`; },
unlockHome(){ SESSION.unlocked = true; V = {view:"home"}; return VIEWS.home(); },

/* ---------- Liste des catégories ---------- */
cats(){ const p = V.p; return `
  <div class="topbar"><button class="back" data-act="lock">← Quitter</button><span class="small muted">Espace de ${nm(p)}</span></div>
  <h2>Le questionnaire</h2>
  <p class="muted">Il n'y a ni classement ni bonne réponse. Répondez à votre rythme : tout est enregistré au fur et à mesure.</p>
  <div class="cats">
    ${CATS.map((c,ci) => { const n = c.items.filter(i => S.answers[p][i.id]).length; return `
      <button class="cat" data-cat="${ci}">
        <span class="n">${esc(c.name)}</span><span class="c">${n} / ${c.items.length}</span>
        <div class="bar"><span style="width:${Math.round(n/c.items.length*100)}%"></span></div>
      </button>`;}).join("")}
    <button class="cat" data-go="ctx"><span class="n">Accélérateurs et freins</span><span class="c">${Object.keys(S.ctx[p]).length} / ${CTX.length}</span></button>
    <button class="cat" data-act="bonus"><span class="n">Questions bonus</span><span class="c">${BONUS.filter(b=>S.bonus[p][b.id]).length} / ${BONUS.length}</span></button>
  </div>
  ${footer(`<button class="btn primary" data-act="resume">${done(p)===0?"Commencer":done(p)<TOTAL?"Reprendre où j'en étais":"Revoir depuis le début"}</button>`)}`; },

/* ---------- Une question ---------- */
quiz(){
  const p = V.p, c = CATS[V.ci];
  if(V.ii < 0) return `
    <div class="topbar"><button class="back" data-go="cats">← Catégories</button><span class="small muted">${V.ci+1} / ${CATS.length}</span></div>
    <div class="qcard">
      <span class="eyebrow">Catégorie</span>
      <div class="label">${esc(c.name)}</div>
      <p class="muted">${esc(c.intro)}</p>
      <p class="small muted">${c.items.length} pratiques</p>
    </div>
    <div class="stack">
      <button class="btn primary block" data-act="start">Commencer</button>
      <button class="btn ghost block" data-act="skipcat">Pas pour moi : tout marquer « Je n'aime pas »</button>
    </div>`;
  const item = c.items[V.ii], a = S.answers[p][item.id] || {}, role = V.role ?? a.r ?? 2;
  const risk = item.risk && RISK[item.risk];
  return `
  <div class="topbar"><button class="back" data-go="cats">← Catégories</button><span class="small muted">${esc(c.name)} · ${V.ii+1}/${c.items.length}</span></div>
  <div class="bar"><span style="width:${Math.round((V.ii+1)/c.items.length*100)}%"></span></div>
  <div class="qcard">
    <div class="spread"><span class="eyebrow">Intensité</span>${lvlDots(item.l)}</div>
    <div class="label">${esc(item.label)}</div>
    ${item.d ? `<p class="desc">${esc(item.d)}</p>` : ""}
    ${risk ? `<div class="risk"><b>Risque élevé.</b> ${esc(risk.txt)}</div>` : ""}
    ${item.r ? `<div class="roles"><span class="eyebrow">Mon rôle</span>
      <div class="seg" role="radiogroup">${[0,1,2].map(x => `<button type="button" role="radio" aria-checked="${role===x}" class="${role===x?"on":""}" data-role="${x}">${x===2?"Les deux":esc(item.r[x])}</button>`).join("")}</div></div>` : ""}
  </div>
  <div class="answers">
    ${Object.entries(ANS).map(([k,t]) => `<button class="ans ${k} ${a.v===k?"sel":""}" data-ans="${k}"><span class="dot"></span><span class="t">${t}</span></button>`).join("")}
  </div>
  <details ${a.c?"open":""}><summary class="small muted" style="cursor:pointer">Ajouter un commentaire (visible par moi seul·e)</summary>
    <textarea id="comment" style="margin-top:8px" placeholder="Précisions, conditions, limites…">${esc(a.c)}</textarea>
  </details>
  <div class="qnav"><button class="link" data-act="prev">← Précédente</button><button class="link" data-act="next">Passer →</button></div>`; },

/* ---------- Bonus ---------- */
bonus(){ const p = V.p, b = S.bonus[p]; return `
  <div class="topbar"><button class="back" data-go="cats">← Catégories</button></div>
  <h2>Questions bonus</h2>
  <p class="muted">Ces réponses restent dans votre profil. Elles ne sont jamais montrées à ${nm(1-p)}.</p>
  <form id="bonusForm" class="stack" novalidate>
    ${BONUS.map(q => `<label class="f">${esc(q.q)}${q.type==="select"
      ? `<select id="b_${q.id}"><option value="">Choisir…</option>${q.opts.map(o=>`<option ${b[q.id]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`
      : `<textarea id="b_${q.id}">${esc(b[q.id])}</textarea>`}</label>`).join("")}
    <button class="btn primary block" type="submit">Enregistrer</button>
  </form>`; },

/* ---------- Fin ---------- */
finished(){ return `
  <div class="hero"><div class="mark"><i></i><i></i></div><h1>C'est noté, ${nm(V.p)}.</h1>
  <p class="muted">Vos réponses sont enregistrées. Passez le téléphone à ${nm(1-V.p)} ou retournez une première carte si vous avez fini tous les deux.</p></div>
  <button class="btn primary block" data-act="lock">Revenir à l'accueil</button>
  <button class="btn ghost block" data-go="profile">Voir mon profil</button>`; },

/* ---------- Profil privé ---------- */
profile(){
  const p = V.p, tab = V.tab || "love", ans = S.answers[p];
  const by = k => Object.entries(ans).filter(([id,a]) => ITEMS[id] && a.v === k);
  const list = by(tab);
  const roleTxt = (it,a) => it.r ? `<em>${a.r===2||a.r==null?"les deux":esc(it.r[a.r]).toLowerCase()}</em>` : "";
  const groups = CATS.map(c => [c, list.filter(([id]) => ITEMS[id].cat === c.id)]).filter(g => g[1].length);
  return `
  <div class="topbar"><button class="back" data-act="lock">← Quitter</button><span class="small muted">Privé</span></div>
  <span class="eyebrow">Mon profil</span>
  <h2>${nm(p)}</h2>
  <div class="stats">
    <div class="stat love"><b>${by("love").length}</b><span class="small muted">J'aime</span></div>
    <div class="stat maybe"><b>${by("maybe").length}</b><span class="small muted">Pourquoi pas</span></div>
    <div class="stat no"><b>${by("no").length}</b><span class="small muted">Mes limites</span></div>
  </div>
  <div class="tabs">
    ${[["love","Mes envies"],["maybe","Curiosités"],["no","Mes limites"],["ctx","Allume / freine"],["bonus","Mes mots"]].map(([k,t]) => `<button class="tab ${tab===k?"on":""}" data-tab="${k}">${t}</button>`).join("")}
  </div>
  ${tab === "ctx" ? `<div class="stack">${["on","off"].map(k => `<div class="stack"><span class="eyebrow">${k==="on" ? "Ce qui m'allume" : "Ce qui me freine"}</span><div class="chips">${CTX.filter(c => S.ctx[p][c.id] === k).map(c => `<span class="chip ${k==="on"?"love":"no"}">${esc(c.label)}</span>`).join("") || `<span class="muted small">Rien pour l'instant.</span>`}</div></div>`).join("")}<p class="small muted">${S.ctxShare[p] ? `Partagé avec ${nm(1-p)} dans vos moments.` : "Non partagé."}</p><button class="btn" data-go="ctx">Modifier</button></div>`
  : tab === "bonus" ? `<div class="stack">${BONUS.map(q => `<div class="card"><span class="eyebrow">${esc(q.q)}</span><p>${S.bonus[p][q.id] ? esc(S.bonus[p][q.id]) : `<span class="muted">Pas encore répondu</span>`}</p></div>`).join("")}<button class="btn" data-act="bonus">Modifier</button></div>`
  : groups.length ? groups.map(([c,l]) => `<div class="stack"><span class="eyebrow">${esc(c.name)}</span><div class="chips">${l.map(([id,a]) => `<button class="chip ${tab}" data-edit="${id}">${esc(ITEMS[id].label)}${roleTxt(ITEMS[id],a)}</button>`).join("")}</div></div>`).join("")
  : `<p class="muted">Rien ici pour l'instant.</p>`}
  ${tab==="no" && list.length ? `<p class="small muted">Vos limites ne seront jamais proposées. ${nm(1-p)} ne sait pas lesquelles vous avez cochées.</p>` : ""}
  ${footer(`<button class="btn primary" data-go="cats">Compléter le questionnaire</button>`)}`; },

/* ---------- Retourner une carte ---------- */
deck(){
  const card = V.card && matchOf(ITEMS[V.card]);
  const left = allMatches().filter(x => !S.revealed.includes(x.item.id) && openLv(x.item.l)).length;
  return `
  <div class="topbar"><button class="back" data-go="home">← Accueil</button><span class="small muted">${left} carte${left>1?"s":""} restante${left>1?"s":""}</span></div>
  ${card ? revealCard(card) + `<div class="stack">${composable(card.item) ? `<button class="btn primary block" data-act="composeCard">Composer un moment avec cette carte</button>`
      : CATS.find(c => c.id === card.item.cat).talk ? `<button class="btn primary block" data-act="talkCard">On en parle ce soir</button>` : ""}
    <div class="row center">${left?`<button class="btn gold" data-act="draw">Carte suivante</button>`:""}<button class="btn ghost" data-go="home">Plus tard</button></div></div>`
  : `<h2>À vous deux</h2><p class="muted">Installez-vous côte à côte. Chaque carte est une envie que vous avez cochée tous les deux.</p>
     <div class="deck"><div class="back-card"></div><div class="back-card"></div><div class="back-card" data-act="draw" role="button" tabindex="0" aria-label="Retourner une carte"><span>Toucher pour retourner</span></div></div>`}`; },

/* ---------- Bothnod découverts ---------- */
revealed(){
  const ms = S.revealed.map(id => ITEMS[id] && matchOf(ITEMS[id])).filter(Boolean);
  return `
  <div class="topbar"><button class="back" data-go="home">← Accueil</button></div>
  <h2>Vos accords découverts</h2>
  ${CATS.map(c => { const l = ms.filter(m => m.item.cat === c.id); return l.length ? `
    <div class="stack"><span class="eyebrow">${esc(c.name)}</span><div class="list">
    ${l.map(m => `<button class="mrow" data-show="${m.item.id}" style="cursor:pointer;color:var(--fg);font:inherit;text-align:left"><span class="t">${esc(m.item.label)}</span><span class="pill s${m.score}">${scoreLabel(m.score)}</span>
    ${m.who ? `<span class="s">${nm(0)} : ${m.who[0]===2?"les deux":esc(m.item.r[m.who[0]]).toLowerCase()} · ${nm(1)} : ${m.who[1]===2?"les deux":esc(m.item.r[m.who[1]]).toLowerCase()}</span>`:""}</button>`).join("")}
    </div></div>` : ""; }).join("")}
  ${ms.length ? "" : `<p class="muted">Aucune carte retournée pour l'instant.</p>`}`; },

/* ---------- Composer un moment ---------- */
moment(){
  const pool = allMatches().filter(m => !m.item.risk && m.item.cat !== "ouverture");
  const cardIt = V.card && ITEMS[V.card] && composable(ITEMS[V.card]) ? ITEMS[V.card] : null;
  /* Intensité à double oui : chacun choisit en privé jusqu'où il veut aller ; on retient la plus douce des deux */
  const saved = V.mo && V.mo.pid, key = cardIt ? cardIt.id : "free", minL = cardIt ? cardIt.l : Math.min(...pool.map(m => m.item.l), 4);
  const vote = saved ? null : (S.lvVote && S.lvVote.key === key ? S.lvVote : null);
  const voted = !!vote && vote.v[0] != null && vote.v[1] != null;
  const refused = voted && (vote.v[0] === 0 || vote.v[1] === 0);
  const agreed = voted && !refused ? Math.max(minL, Math.min(vote.v[0], vote.v[1])) : null;
  const recap = cardIt ? `<section class="reveal" style="animation:none;padding:16px 18px;gap:8px">
      <div class="spread"><span class="eyebrow">Votre carte · ${esc(catName(cardIt.cat))}</span>${(m => m ? `<span class="pill s${m.score}">${scoreLabel(m.score)}</span>` : "")(matchOf(cardIt))}</div>
      <div class="label" style="font-size:1.5rem">${esc(cardIt.label)}</div>
      ${(m => m ? whoHtml(m) : "")(matchOf(cardIt))}
      <span class="dbl"><i aria-hidden="true"></i>Double oui</span>
    </section>` : "";
  const top = `<div class="topbar">${cardIt ? `<button class="back" data-backcard="${cardIt.id}">← Retour à la carte</button>` : `<button class="back" data-go="home">← Accueil</button>`}</div>
    <h2>Composer un moment</h2>${recap}`;
  if(!saved && !voted){ const st = p => vote && vote.v[p] != null; return `${top}
    <section class="card">
      <span class="eyebrow">Chacun choisit son intensité</span>
      <h3>Jusqu'où avez-vous envie d'aller ce soir ?</h3>
      <p class="muted small">Chacun répond en privé, avec son code ou son empreinte. Bothnod retient l'intensité la plus douce des deux : personne ne sait si l'autre voulait aller plus loin.</p>
      <div class="row center">${[0,1].map(p => `<button class="btn ${st(p) ? "" : "primary"}" data-pin="${p}" data-next="lvPick">${nm(p)}${st(p) ? " ✓" : ""}</button>`).join("")}</div>
      <p class="small muted" style="text-align:center">${st(0) || st(1) ? `${nm(st(0) ? 0 : 1)} a répondu. Au tour de ${nm(st(0) ? 1 : 0)}.` : "Personne n'a encore répondu."}</p>
    </section>`; }
  if(refused) return `${top}
    <section class="card soft">
      <span class="eyebrow">Pas pour ce soir</span>
      <h3>On garde cette idée pour une autre fois</h3>
      <p class="muted small">L'un de vous n'en a pas envie ce soir, et c'est très bien ainsi. Personne n'a à se justifier. Et si vous choisissiez quelque chose de tout doux ?</p>
      <div class="chips">${ALTS.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>
      <div class="row center"><button class="btn gold" data-act="voteReset">Recommencer le choix</button><button class="btn ghost" data-go="home">Revenir à l'accueil</button></div>
    </section>`;
  if(agreed && !V.mo){ V.lv = agreed; const seen = (vote.mo || []).find(m => m && m.lv === agreed); V.mo = seen ? {...seen} : compose(agreed, cardIt ? cardIt.id : null); }
  const avail = n => agreed ? n >= minL && n <= agreed : cardIt ? n >= cardIt.l : pool.some(m => m.item.l <= n);
  const lv = V.lv || (cardIt ? cardIt.l : [2,1].find(avail) || [1,2,3,4].find(avail));
  const helps = [0,1].filter(p => S.ctxShare[p]).flatMap(p => CTX.filter(c => S.ctx[p][c.id] === "on").slice(0,2).map(c => `${c.label.toLowerCase()} (${nm(p)})`));
  const avoid = [0,1].filter(p => S.ctxShare[p]).flatMap(p => CTX.filter(c => S.ctx[p][c.id] === "off").slice(0,2).map(c => `${c.label.toLowerCase()} (${nm(p)})`));
  const mo = V.mo;
  return `
  ${top}
  ${agreed ? `<p class="banner">Votre intensité commune : <strong>${LEVELS[agreed-1].name}</strong>. Vous pouvez aussi choisir plus doux.</p>` : ""}
  <p class="muted">${saved ? "Votre moment choisi ensemble." : "Touchez une intensité pour voir le scénario, puis choisissez-le s'il vous plaît à tous les deux."}</p>
  <div class="levels">${LEVELS.filter(L => !agreed || (L.n >= minL && L.n <= agreed)).map(L => openLv(L.n) ? `<button class="level ${lv===L.n?"on":""}" data-lv="${L.n}" ${avail(L.n)?"":"disabled"}><b>${L.name}</b><span class="small muted">${L.d}</span>${lvlDots(L.n)}</button>`
    : `<button class="level" data-go="plus"><b>${L.name}</b><span class="small muted">${L.d}</span><span><span class="lockpill">Bothnod+</span></span></button>`).join("")}</div>
  ${mo ? `<section class="card">
      <span class="eyebrow">Votre moment · ${LEVELS[mo.lv-1].name}</span>
      <h3>${esc(mo.title)}</h3>
      <div class="steps">
        <div class="step"><div><h4>Se mettre d'accord</h4><p>Deux minutes face à face : « ce soir j'ai envie de… », « ce soir je ne veux pas… ». Rappelez votre signal vert, orange, rouge.</p></div></div>
        <div class="step"><div><h4>Ambiance</h4><p>${esc(mo.amb)}</p>${helps.length ? `<p class="small muted">Ce qui aide : ${esc(helps.join(", "))}.</p>` : ""}${avoid.length ? `<p class="small muted">À écarter ce soir : ${esc(avoid.join(", "))}.</p>` : ""}</div></div>
        <div class="step"><div><h4>Ouverture</h4><p>${mo.open}</p></div></div>
        <div class="step"><div><h4>Le cœur du moment</h4><p>${mo.core}</p></div></div>
        <div class="step"><div><h4>Après</h4><p>Restez peau contre peau quelques minutes, un verre d'eau, puis chacun dit une chose qu'il a aimée. Le lendemain, un mot doux par message.</p></div></div>
      </div>
      ${mo.pid ? `<p class="banner">Choisi ensemble le ${dshort(isoDay(mo.created || Date.now()))}. Ce moment vous attend sur l'accueil et apparaît dans votre frise.</p>` : ""}
      ${mo.pid ? `<div class="row center"><button class="btn gold" data-act="lived">Nous l'avons vécu</button><button class="btn" data-act="planMoment">Le prévoir dans l'agenda</button></div>
      <button class="link" data-act="dropMoment" style="align-self:center">Retirer ce choix</button>`
      : `<div class="row center"><button class="btn primary" data-act="chooseMoment">Choisir ce moment</button><button class="btn ghost" data-act="compose">Une autre proposition</button></div>
      <p class="small muted" style="text-align:center">En le choisissant, vous le retrouvez sur l'accueil, dans votre frise et dans l'agenda si vous le prévoyez.</p>`}
      ${S.aff ? shopHtml([COFFRETS[Math.min(mo.lv,3)], ...mo.ids.flatMap(id => affFor(ITEMS[id]))]) : ""}
      ${S.aff ? `<div class="shop"><span class="eyebrow">Pour en faire une vraie sortie</span>${EXPERIENCES[mo.lv].map(e => `<div class="prod"><div><strong>${esc(e.p)}</strong><p class="small muted">${esc(e.w)}</p></div><span class="pill">Réservation à brancher</span></div>`).join("")}</div>` : ""}
    </section>` : ""}
  ${mo ? "" : footer(`<button class="btn primary" data-act="compose">Composer</button>`)}`; },

  const lead = (base.getDay() + 6) % 7, days = new Date(y, m+1, 0).getDate(), sel = V.day;
  const wd = [0,1,2,3,4,5,6].map(i => new Date(2024, 0, 1+i).toLocaleDateString(LOC(), {weekday:"narrow"}));
  const list = sel ? (byDay[sel] || []) : agendaEvents(t, isoDay(Date.now() + 45*DAY));

    <label class="f">Ce que vous prévoyez<input type="text" id="rdvT" maxlength="90" value="${esc(V.prefill || "")}" placeholder="Dîner à la maison, sans téléphone" autocomplete="off"></label>
    <button type="button" class="link" data-act="rdvIdea" style="align-self:flex-start">Une idée au hasard</button>
    <div class="two"><label class="f">Le<input type="date" id="rdvD" value="${esc(sel && sel >= t ? sel : "")}" min="${t}"></label><label class="f">À (facultatif)<input type="time" id="rdvH"></label></div>
    ${linkSelect(V.link)}
    <label class="f">Proposé par<select id="rdvBy"><option value="0">${nm(0)}</option><option value="1">${nm(1)}</option></select></label>
    <p class="err" id="rdvErr" hidden></p>
    <button class="btn primary" type="submit">Ajouter à l'agenda</button>
  </form>`;
  return `
  <div class="topbar"><button class="back" data-go="together">← Ensemble</button></div>
  <h2>Agenda partagé</h2>
  ${V.prefill ? form : ""}
  <div class="spread"><button class="link" data-mo="-1" aria-label="Mois précédent">← Précédent</button><h3 class="cap1">${base.toLocaleDateString(LOC(), {month:"long", year:"numeric"})}</h3><button class="link" data-mo="1" aria-label="Mois suivant">Suivant →</button></div>
  <div class="cal">
    ${wd.map(d => `<span class="wd" aria-hidden="true">${d}</span>`).join("")}
    ${"<span></span>".repeat(lead)}
    ${Array.from({length:days}, (_, i) => { const iso = isoDay(new Date(y, m, i+1)), ev = byDay[iso] || [], types = [...new Set(ev.map(e => e.type))];
      return `<button class="cal-d ${iso < t ? "past" : ""} ${iso === t ? "today" : ""} ${iso === sel ? "sel" : ""}" data-day="${iso}" aria-pressed="${iso === sel}" aria-label="${dlong(iso)}${ev.length ? `, ${ev.length} événement${ev.length>1?"s":""}` : ""}">${i+1}<span class="dots">${types.map(x => `<i class="dot d-${x}"></i>`).join("")}</span></button>`; }).join("")}
  </div>
  <div class="legend"><span><i class="dot d-rdv"></i>Rendez-vous</span><span><i class="dot d-key"></i>Date clé</span><span><i class="dot d-letter"></i>Lettre</span><span><i class="dot d-note"></i>Pense-bête</span>${S.distance.on ? `<span><i class="dot d-meet"></i>Retrouvailles</span>` : ""}</div>
  <h3>${sel ? `Le ${dlong(sel)}` : "Dans les semaines qui viennent"}</h3>
  <div class="list">${list.length ? list.map(e => evRow(e, !sel)).join("") : `<p class="muted small">${sel ? "Rien ce jour-là." : "Rien de prévu pour l'instant. Un rendez-vous, même simple, suffit pour commencer."}</p>`}</div>
  ${V.prefill ? "" : form}
  <button class="toggle" role="switch" aria-checked="${!!S.nudge}" data-act="toggleNudge"><span><strong>Rappel doux</strong><br><span class="small muted">Si rien n'est prévu depuis trois semaines, une idée de rendez-vous apparaît sur l'accueil. Jamais de notification.</span></span><span class="sw"></span></button>
  ${tabbar("together")}`; },

/* ---------- Collections ---------- */
collection(){
  const c = COLLECTIONS.find(x => x.id === V.col) || seasonCol(), open = c.id === seasonCol().id || PLUS();
  return `
  <div class="topbar"><button class="back" data-go="together">← Ensemble</button>${c.id === seasonCol().id ? `<span class="status live">En ce moment</span>` : ""}</div>
  <span class="eyebrow">Collection</span>
  <h2>${esc(c.name)}</h2>
  <p class="muted">${esc(c.d)}</p>
  ${open ? `<div class="card">${c.cards.map(x => `<div class="idea"><h3>${esc(x.t)}</h3><p class="muted small">${esc(x.d)}</p><button class="btn" data-plan-idea="${esc(x.t)}">Planifier</button></div>`).join("")}</div>`
    : `<div class="card"><span class="lockpill" style="align-self:flex-start">Bothnod+</span><p class="muted small">La collection de saison est offerte. Toutes les autres, et les nouvelles de chaque mois, sont incluses dans Bothnod+.</p><button class="btn primary" data-go="plus">Découvrir Bothnod+</button></div>`}
  <button class="link" data-go="collections" style="align-self:flex-start">Toutes les collections</button>
  ${tabbar("together")}`; },
collections(){
  const cur = seasonCol().id, mn = ms => ms.map(m => new Date(2024, m-1, 15).toLocaleDateString(LOC(), {month:"long"})).join(", ");
  return `
  <div class="topbar"><button class="back" data-go="together">← Ensemble</button></div>
  <h2>Collections</h2>
  <p class="muted">Des idées de rendez-vous et de rituels selon la saison et les moments de la vie.</p>
  <div class="cats">${COLLECTIONS.map(c => `<button class="cat" data-col="${c.id}"><span class="n">${esc(c.name)}</span><span class="c">${c.id === cur ? "En ce moment" : PLUS() ? "" : "Bothnod+"}</span><span class="small muted" style="grid-column:1/-1">${c.months.length ? mn(c.months) : "À tout moment"}</span></button>`).join("")}</div>
  ${tabbar("together")}`; },

/* ---------- Mode à distance ---------- */
distance(){ return `
  <div class="topbar"><button class="back" data-go="together">← Ensemble</button></div>
  <h2>Loin l'un de l'autre</h2>
  <p class="muted">Des rituels simples pour garder le lien quand vous êtes séparés, quelques jours ou quelques mois.</p>
  ${S.distance.on ? distanceCard() : `<button class="btn primary" data-act="toggleDistance">Activer le mode à distance</button>`}
  <div class="card">${DISTANCE.map(c => `<div class="idea"><span class="eyebrow">${esc(c.k)}</span><p>${esc(c.t)}</p></div>`).join("")}</div>
  <div class="row">${[0,1].map(p => `<button class="btn" data-pin="${p}" data-next="letters">Écrire une lettre (${nm(p)})</button>`).join("")}</div>
  ${tabbar("together")}`; },

/* ---------- Notre histoire ---------- */
history(){
  const ev = historyEvents(), groups = [], t = todayIso();
  ev.forEach(e => { const k = e.date.slice(0,7); let g = groups[groups.length-1]; if(!g || g.k !== k){ g = {k, items:[]}; groups.push(g); } g.items.push(e); });
  return `
  <div class="topbar"><button class="back" data-go="together">← Ensemble</button></div>
  <h2>Notre histoire</h2>
  <p class="muted">Ce que vous avez vécu ensemble, au fil des mois. Les accords sont comptés sans être nommés : cette page peut s'ouvrir sans gêne.</p>
  ${groups.length ? groups.map(g => `<section><h3 class="tl-mh cap1">${monthName(g.k)}</h3>${tlHtml(g.items, true)}</section>`).join("") : `<div class="card"><h3>Votre frise est vide</h3><p class="muted small">Ajoutez la date de votre rencontre, ou prévoyez un premier rendez-vous.</p></div>`}
  <form id="keyForm" class="card" novalidate>
    <h3>Ajouter une date clé</h3>
    <label class="f">Ce qui s'est passé<input type="text" id="keyT" maxlength="70" placeholder="Notre rencontre, notre premier voyage" autocomplete="off"></label>
    <label class="f">Le<input type="date" id="keyD" max="${t}"></label>
    <label class="check"><input type="checkbox" id="keyY" checked> La fêter chaque année : elle apparaît dans l'agenda.</label>
    <p class="err" id="keyErr" hidden></p>
    <button class="btn primary" type="submit">Ajouter à la frise</button>
  </form>
  ${tabbar("together")}`; },

/* ---------- Rétrospective annuelle ---------- */
year(){
  const y = new Date().getFullYear(), ys = String(y), inY = d => isoDay(d).startsWith(ys), t = todayIso();
  const top = `<div class="topbar"><button class="back" data-go="together">← Ensemble</button></div>`;
  if(!PLUS()) return `${top}<span class="lockpill" style="align-self:flex-start">Bothnod+</span><h2>Votre année ${y}</h2>
    <p class="muted">Une rétrospective privée de votre année à deux : moments vécus, rendez-vous, lettres, nouveaux points communs. Elle n'est jamais comparée à d'autres couples.</p>
    <button class="btn primary block" data-go="plus">Découvrir Bothnod+</button>${tabbar("together")}`;
  const ev = historyEvents().filter(e => e.date.startsWith(ys));
  const stats = [
    [S.lived.filter(l => inY(l.date)).length, "moments vécus"],
    [S.dates.filter(d => d.date.startsWith(ys) && d.date < t).length, "rendez-vous"],
    [Object.keys(S.daily).filter(k => k.startsWith(ys)).length, "cartes du jour"],
    [Object.values(S.revAt).filter(inY).length, "nouveaux accords"],
    [S.letters.filter(l => inY(l.created)).length, "lettres écrites"],
    [MEDIA.filter(m => inY(m.date)).length, "photos dans l'album"],
  ];
  const perM = {}; ev.filter(e => e.type === "lived" || e.type === "rdv").forEach(e => { const k = e.date.slice(0,7); perM[k] = (perM[k] || 0) + 1; });
  const best = Object.entries(perM).sort((a,b) => b[1] - a[1])[0];
  const kept = ev.filter(e => ["key","rdv","letter"].includes(e.type)).slice(0,6);
  return `${top}
  <section class="recap"><span class="muted">${nm(0)} &amp; ${nm(1)}</span><h1>Votre année ${y}</h1><p class="muted">${ev.length ? `Elle tient déjà en ${ev.length} souvenir${ev.length>1?"s":""} sur votre frise.` : "Votre année commence ici."}</p></section>
  <div class="stats">${stats.map(([n,l]) => `<div class="stat"><b>${n}</b><span class="small muted">${l}</span></div>`).join("")}</div>
  ${best ? `<section class="card"><span class="eyebrow">Votre mois le plus à deux</span><h3 class="cap1">${monthName(best[0])}</h3><p class="muted small">${best[1]} moment${best[1]>1?"s":""} et rendez-vous partagés.</p></section>` : ""}
  ${kept.length ? `<section class="card"><span class="eyebrow">Ce que vous avez gardé</span>${tlHtml(kept)}</section>` : ""}
  <p class="small muted">${S.msgs.filter(m => inY(m.date)).length} messages échangés cette année. Cette rétrospective reste entre vous : elle n'est comparée à aucun autre couple.</p>
  <button class="btn ghost" data-go="history">Voir toute la frise</button>
  ${tabbar("together")}`; },

/* ---------- Lettres à ouvrir plus tard (espace privé) ---------- */
letters(){
  const p = V.p, t = todayIso(), tab = V.tab || "inbox", o = 1 - p;
  const mine = S.letters.filter(l => l.to === p).sort((a,b) => (!!a.opened - !!b.opened) || (a.openAt < b.openAt ? -1 : 1));
  const sent = S.letters.filter(l => l.by === p).sort((a,b) => b.created - a.created);
  const tomorrow = isoDay(Date.now() + DAY), annK = agendaEvents(tomorrow, isoDay(Date.now() + 366*DAY)).find(e => e.type === "key");
  const presets = [[isoDay(Date.now() + 7*DAY), "Dans une semaine"], [isoDay(Date.now() + 30*DAY), "Dans un mois"], [nextValentine(), "À la Saint-Valentin"], [isoDay(Date.now() + 365*DAY), "Dans un an"]];
  if(annK) presets.push([annK.date, annK.title]);
  if(S.distance.on && S.distance.until > t) presets.unshift([S.distance.until, "Le jour des retrouvailles"]);
  const letter = (l, fresh) => `<article class="letter ${fresh ? "fresh" : ""}"><span class="lm">De ${nm(l.by)}, écrite le ${dshort(isoDay(l.created))}</span><p class="lt">${esc(l.text)}</p><span class="lm">Ouverte le ${dshort(isoDay(l.opened))}</span></article>`;
  const seal = (l, who) => `<div class="seal ${l.openAt > t ? "locked" : ""}"><span class="wax" aria-hidden="true">${esc((S.couple.names[l.by] || "?").charAt(0))}</span><div>
      <b>${who}</b><span class="small muted">${l.openAt > t ? `Scellée jusqu'au ${dlong(l.openAt)}` : "Elle peut être ouverte dès maintenant"}</span>
      ${l.to === p && l.openAt <= t ? `<button class="btn gold" data-openletter="${l.id}">Ouvrir la lettre</button>` : ""}</div></div>`;
  return `
  <div class="topbar"><button class="back" data-act="closeLetters">← Fermer</button><span class="small muted">Espace de ${nm(p)}</span></div>
  <h2>Lettres</h2>
  <div class="tabs"><button class="tab ${tab==="inbox"?"on":""}" data-ltab="inbox">Pour moi${mine.some(l => !l.opened && l.openAt <= t) ? " ●" : ""}</button><button class="tab ${tab==="write"?"on":""}" data-ltab="write">Écrire</button><button class="tab ${tab==="sent"?"on":""}" data-ltab="sent">Envoyées</button></div>
  ${tab === "inbox" ? `<div class="stack">${mine.length ? mine.map(l => l.opened ? letter(l, V.fresh === l.id) : seal(l, `Une lettre de ${nm(l.by)}`)).join("") : `<p class="muted">Aucune lettre pour l'instant. ${nm(o)} peut vous en écrire une depuis son espace.</p>`}</div>`
  : tab === "write" ? `<form id="letForm" class="stack" novalidate>
      <p class="muted">${nm(o)} verra qu'une lettre l'attend et la date d'ouverture, mais pas son contenu avant ce jour-là.</p>
      <label class="f">Votre lettre à ${nm(o)}<textarea id="letT" maxlength="4000" style="min-height:200px" placeholder="Ce que j'ai envie que tu saches…"></textarea></label>
      <label class="f">À ouvrir le<input type="date" id="letD" min="${tomorrow}"></label>
      <div class="chips">${presets.map(([d,l]) => `<button type="button" class="chip" data-preset="${d}">${esc(l)}<em>${dshort(d)}</em></button>`).join("")}</div>
      <p class="err" id="letErr" hidden></p>
      <button class="btn primary block" type="submit">Sceller la lettre</button>
    </form>`
  : `<div class="stack">${V.sentOk ? `<p class="banner">Lettre scellée. Elle s'ouvrira à la date choisie.</p>` : ""}${sent.length ? sent.map(l => `<div class="card"><div class="spread"><b>Pour ${nm(l.to)}</b><span class="status ${l.opened ? "live" : "pending"}">${l.opened ? "Ouverte" : "Scellée"}</span></div>
      <p class="small muted">${l.opened ? `Ouverte le ${dshort(isoDay(l.opened))}` : `À ouvrir le ${dlong(l.openAt)}`}</p>
      <p class="lt-prev">${esc(l.text)}</p>
      ${l.opened ? "" : `<button class="link" data-takeback="${l.id}" style="align-self:flex-start">Reprendre cette lettre</button>`}</div>`).join("") : `<p class="muted">Vous n'avez encore écrit aucune lettre.</p>`}</div>`}`; },

/* ---------- Revoir ses réponses (espace privé) ---------- */
review(){
  const p = V.p;
  if(V.done) return `
    <div class="topbar"><button class="back" data-go="home">← Accueil</button></div>
    <h2>C'est enregistré, ${nm(p)}</h2>
    <p class="muted">${V.changed ? `${V.changed} réponse${V.changed>1?"s":""} mise${V.changed>1?"s":""} à jour.` : "Rien n'a changé, et c'est très bien aussi."} Si de nouveaux accords apparaissent, vous les découvrirez ensemble, comme d'habitude. ${nm(1-p)} ne voit pas ce que vous avez modifié.</p>
    <button class="btn primary block" data-go="home">Revenir à l'accueil</button>`;
  const list = reviewList(p), off = V.off || 0, page = list.slice(off, off + 10);
  return `
  <div class="topbar"><button class="back" data-act="reviewDone">← Terminer</button><span class="small muted">Espace de ${nm(p)}</span></div>
  <h2>Vos envies ont peut-être changé</h2>
  <p class="muted">Revoyez ces réponses une par une, ou pas du tout. On commence par vos « pourquoi pas » et vos « non », ceux qui bougent le plus souvent.</p>
  ${page.length ? `<div class="card">${page.map(id => { const it = ITEMS[id], a = S.answers[p][id]; return `<div class="rv">
      <div class="spread"><b>${esc(it.label)}</b>${lvlDots(it.l)}</div>
      <span class="small muted">${esc(catName(it.cat))}</span>
      <div class="seg">${["love","maybe","no"].map(v => `<button class="${a.v === v ? "on" : ""}" data-rv="${id}" data-v="${v}" aria-pressed="${a.v === v}">${ANS[v]}</button>`).join("")}</div>
    </div>`; }).join("")}</div>` : `<p class="muted">Aucune réponse à revoir pour l'instant.</p>`}
  <div class="row">${off + 10 < list.length ? `<button class="btn" data-act="reviewMore">10 autres réponses</button>` : ""}<button class="btn primary" data-act="reviewDone">J'ai terminé</button></div>`; },

/* ---------- Cartes de l'amour : liste des quiz ---------- */
maps(){ return `
  <div class="topbar"><button class="back" data-go="together">← Ensemble</button></div>
  <h2>Cartes de l'amour</h2>
  <p class="muted">Chacun répond pour soi, puis devine ce que l'autre a répondu. Les réponses ne s'affichent que lorsque vous avez terminé tous les deux. Pas de score : les écarts sont des sujets de conversation.</p>
  ${QUIZZES.map(q => { const st = mapState(q.id), open = q.free || PLUS(), both = st.at[0] && st.at[1];
    const stat = p => st.at[p] ? "terminé" : Object.keys(st.a[p]).length ? "en cours" : "à faire";
    return `<section class="card">
      <div class="spread"><h3>${esc(q.title)}</h3>${open ? (both ? `<span class="status live">Résultats prêts</span>` : "") : `<span class="lockpill">Bothnod+</span>`}</div>
      <p class="muted small">${esc(q.d)} ${q.qs.length} questions.</p>
      ${open ? `<p class="small">${nm(0)} : ${stat(0)} · ${nm(1)} : ${stat(1)}</p>
      <div class="row">${both ? `<button class="btn gold" data-mapres="${q.id}">Voir vos surprises</button>` : [0,1].filter(p => !st.at[p]).map(p => `<button class="btn" data-mapgo="${q.id}" data-mp="${p}">${nm(p)}${Object.keys(st.a[p]).length ? ", continuer" : ""}</button>`).join("")}</div>`
      : `<button class="btn ghost" data-go="plus" style="align-self:flex-start">Découvrir Bothnod+</button>`}
    </section>`; }).join("")}
  ${tabbar("together")}`; },

/* ---------- Cartes de l'amour : répondre (espace privé) ---------- */
map(){
  const p = V.p, o = 1 - p, q = QUIZZES.find(x => x.id === (V.id || MAP_ID));
  if(!q) return `<div class="topbar"><button class="back" data-go="maps">← Quiz</button></div><p class="muted">Ce quiz n'existe plus.</p>`;
  const st = mapState(q.id);
  if(V.end){ const other = st.at[o]; return `
    <div class="topbar"><button class="back" data-go="maps">← Quiz</button><span class="small muted">Espace de ${nm(p)}</span></div>
    <h2>C'est fait, ${nm(p)}</h2>
    <p class="muted">${other ? `${nm(o)} a aussi terminé : vos surprises vous attendent.` : `Vos réponses restent cachées jusqu'à ce que ${nm(o)} ait terminé à son tour.`}</p>
    ${other ? `<button class="btn gold block" data-mapres="${q.id}">Voir vos surprises</button>` : `<button class="btn primary block" data-go="maps">Revenir aux quiz</button>`}`; }
  const i = Math.min(V.i ?? Math.max(0, q.qs.findIndex((_, k) => st.a[p][k] === undefined)), q.qs.length - 1), qq = q.qs[i];
  const a = st.a[p][i], g = st.g[p][i], last = i === q.qs.length - 1;
  const opts = (sel, attr) => `<div class="opts">${qq.o.map((t,k) => `<button class="opt ${sel === k ? "on" : ""}" ${attr}="${k}" aria-pressed="${sel === k}">${esc(t)}</button>`).join("")}</div>`;
  return `
  <div class="topbar"><button class="back" data-go="maps">← Plus tard</button><span class="small muted">Espace de ${nm(p)}</span></div>
  <div class="qhead"><span class="eyebrow">${esc(q.title)} · ${i+1} / ${q.qs.length}</span><div class="bar"><span style="width:${Math.round((i+1)/q.qs.length*100)}%"></span></div></div>
  <div class="qcard">
    <p class="label">${esc(qq.q)}</p>
    <div class="stack"><span class="small muted">Pour vous</span>${opts(a, "data-ma")}</div>
    <div class="stack"><span class="small muted">Et pour ${nm(o)}, selon vous ?</span>${opts(g, "data-mg")}</div>
  </div>
  <div class="qnav"><button class="link" data-act="mapPrev" ${i ? "" : "disabled"}>← Précédente</button><button class="link" data-act="mapNext">Passer</button><button class="btn primary" data-act="mapNext" ${a !== undefined && g !== undefined ? "" : "disabled"}>${last ? "Terminer" : "Suivante"}</button></div>`; },

/* ---------- Cartes de l'amour : vos surprises ---------- */
mapRes(){
  const q = QUIZZES.find(x => x.id === V.id), st = q && mapState(q.id);
  if(!q || !(st.at[0] && st.at[1])) return `<div class="topbar"><button class="back" data-go="maps">← Quiz</button></div><p class="muted">Les résultats s'affichent quand vous avez terminé tous les deux.</p>`;
  const rows = q.qs.map((qq, i) => ({qq, a:[st.a[0][i], st.a[1][i]], g:[st.g[0][i], st.g[1][i]]})).filter(r => r.a[0] !== undefined || r.a[1] !== undefined);
  const miss = (r, p) => r.a[1-p] !== undefined && r.g[p] !== undefined && r.g[p] !== r.a[1-p];
  const surprises = rows.filter(r => miss(r,0) || miss(r,1)), known = rows.filter(r => !surprises.includes(r));
  const line = (r, p) => r.a[p] === undefined ? "" : `<p class="small"><b>${nm(p)}</b> : ${esc(r.qq.o[r.a[p]])}${r.g[1-p] === undefined ? "" : r.g[1-p] === r.a[p] ? `<span class="muted"> · ${nm(1-p)} l'avait deviné</span>` : `<span class="muted"> · ${nm(1-p)} pensait : ${esc(r.qq.o[r.g[1-p]])}</span>`}</p>`;
  const item = r => `<div class="rv"><b>${esc(r.qq.q)}</b>${line(r,0)}${line(r,1)}</div>`;
  return `
  <div class="topbar"><button class="back" data-go="maps">← Quiz</button></div>
  <span class="eyebrow">${esc(q.title)}</span>
  <h2>${surprises.length ? `${surprises.length} sujet${surprises.length>1?"s":""} de conversation` : "Rien ne vous a surpris"}</h2>
  <p class="muted">${surprises.length ? "Là où vous vous êtes surpris, il y a quelque chose à découvrir. Choisissez-en un et parlez-en ce soir." : "Vous vous connaissez bien sur ce thème. Essayez un autre quiz, ou refaites celui-ci dans quelques mois."}</p>
  ${surprises.length ? `<div class="card">${surprises.map(item).join("")}</div>` : ""}
  ${known.length ? `<details class="card"><summary>Ce que vous saviez déjà (${known.length})</summary>${known.map(item).join("")}</details>` : ""}
  <div class="row"><button class="btn ghost" data-act="mapReset">Refaire ce quiz</button><button class="link" data-go="maps">Autres quiz</button></div>
  ${tabbar("together")}`; },

/* ---------- Réglages ---------- */
settings(){ return `
  <div class="topbar"><button class="back" data-go="home">← Accueil</button></div>
  <h2>Réglages</h2>

      : m.score === 2 ? `<p class="tip">Ni l'un ni l'autre ne l'a encore vraiment exploré. Allez-y doucement, une première fois courte, et faites le point après.</p>`

   5. GÉNÉRATION D'UN MOMENT
   ========================================================= */
const AMB = [
  "Soirée sans écrans : téléphones dans une autre pièce, lumière tamisée, une playlist lente, une heure devant vous.",
  "Commencez par une douche ou un bain à deux, sans autre objectif que de prendre soin de l'autre.",
  "Un message le matin pour fixer le rendez-vous, et l'envie qui monte toute la journée.",
  "Un lieu inhabituel : le salon, une chambre d'hôtel, ou simplement des draps neufs.",
  "Dîner léger à la maison, chacun choisit une tenue pour l'autre.",
  "Grasse matinée du week-end, sans réveil ni horaire.",
];
const pick = a => a[Math.floor(Math.random()*a.length)];
function roleSentence(m){
  if(!m.who || (m.who[0]===2 && m.who[1]===2)) return "";
  const r = m.item.r;
  const giver = m.who[0]===0 || m.who[1]===1 ? 0 : 1;
  return ` (${nm(giver)} : ${esc(r[0]).toLowerCase()}, ${nm(1-giver)} : ${esc(r[1]).toLowerCase()})`;
}
const composable = it => !it.risk && it.cat !== "ouverture" && openLv(it.l);
function compose(lv, coreId){
  const pool = allMatches().filter(m => !m.item.risk && m.item.cat !== "ouverture" && openLv(m.item.l));
  const inLv = pool.filter(m => m.item.l === lv), under = pool.filter(m => m.item.l <= lv);
  const weighted = l => { const w = []; l.forEach(m => { for(let i=0;i<m.score*m.score;i++) w.push(m); }); return w; };
  const forced = coreId && pool.find(m => m.item.id === coreId);
  const core = forced || pick(weighted(inLv.length ? inLv : under));
  const soft = pool.filter(m => m.item.l === 1 && m.item.id !== core.item.id);
  const extra = under.filter(m => m.item.id !== core.item.id && m.item.cat !== core.item.cat && m.item.l > 1);
  const open = soft.length ? pick(soft) : null;
  const extraLv = forced && lv > core.item.l ? extra.filter(m => m.item.l === lv) : [];
  const add = extra.length && lv > 1 ? pick(weighted(extraLv.length ? extraLv : extra)) : null;
  const L = m => `<strong>${esc(m.item.label)}</strong>${roleSentence(m)}`;
  return {
    lv,
    ids: [core, add, open].filter(Boolean).map(m => m.item.id),
    title: core.item.label + (add ? " & " + add.item.label.toLowerCase() : ""),
    amb: pick(AMB),
    open: open ? `${L(open)}, sans se presser. Dix minutes au moins avant d'aller plus loin.` : "Caresses lentes sur tout le corps, en évitant d'abord les zones génitales, dix minutes au moins.",
    core: `${L(core)}${add ? `, puis ${L(add)}` : ""}. ${core.score===2?"C'est une découverte pour vous deux : commencez doucement et faites un point à mi-chemin.":"Vous en avez envie tous les deux : laissez-vous guider par ce qui vient."}`,
  };
}

function firstUnanswered(p){
  for(let ci=0; ci<CATS.length; ci++){ const ii = CATS[ci].items.findIndex(i => !S.answers[p][i.id]); if(ii>=0) return {ci, ii}; }
  return null;
}
function advance(){
  const c = CATS[V.ci];
  if(V.ii < c.items.length-1) return go("quiz",{p:V.p, ci:V.ci, ii:V.ii+1, edit:V.edit});
  if(V.edit) return go("profile",{p:V.p});
  if(V.ci < CATS.length-1) return go("quiz",{p:V.p, ci:V.ci+1, ii:-1});
  go("bonus",{p:V.p, end:true});
}
function saveComment(){
  const t = document.getElementById("comment"); if(!t) return;
  const item = CATS[V.ci].items[V.ii], a = S.answers[V.p][item.id];
  if(a){ a.c = t.value.trim() || undefined; save(); }
}

/* Actions déléguées (le fil ajoute des posts sans re-rendu) */
$app.addEventListener("click", e => {
  const l = e.target.closest("[data-like]"), r = e.target.closest("[data-report]");
  const t = l || r; if(!t) return;
  const id = t.dataset.like || t.dataset.report;
  if(l) S.liked[id] = !S.liked[id] || undefined; else S.reported[id] = true;
  save();
  const post = id[0] === "d" ? demoPost(+id.slice(1)) : id[0] === "c" && S.circle.length ? circlePost(+id.slice(1)) : S.posts.find(x => x.id === id);
  const art = t.closest(".post"); if(post && art) art.outerHTML = postHtml(post);
});
render();
loadMedia().then(() => { tickModeration(); render(); });
